[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xadrez-das-lendas"
version = "2.0.0"
description = "Jogo de puzzles de xadrez com transições cinematográficas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5,<3",
    "opencv-python>=4.8,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "pyinstaller>=6,<7",
]

[project.scripts]
xadrez-das-lendas = "xadrez_das_lendas.game:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
